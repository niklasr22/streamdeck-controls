[metadata]
name = sd_controls
version = attr: sd_controls.__version__
author = Niklas Rousset
author_email = byrousset@gmail.com
description = A small and simple framework for streamdeck applications
keywords = streamdeck
license = MIT
long_description = file: README.md
long_description_content_type = text/markdown
classifiers = 
    Programming Language :: Python :: 3
    Operating System :: OS Independent
url = https://github.com/niklasr22/streamdeck-controls
project_urls =
    Bug Tracker = https://github.com/niklasr22/streamdeck-controls/issues


[options]
include_package_data = False
python_requires = >=3.12
install_requires =
    hid>=1.0.9
    Pillow>=13.0.0
package_dir=
    =src
packages=find:

[options.packages.find]
where=src

[options.package_data]
sd_controls = imgs/*.jpeg, fonts/Roboto/*.ttf, fonts/Roboto/LICENSE.txt

[options.extras_require]
dev =
    build>=1.6.1
    twine>=7.0
    ruff>=0.17.3
